  if(!pack||pack.formato!==FMT||!Array.isArray(pack.actas)){toast("Ese archivo no es una exportación de Actas de vivienda.");return}
  const nuevas=pack.actas.filter(x=>x&&x.id&&(!ACTAS[x.id]||String(x.actualizado||"")>String(ACTAS[x.id].actualizado||"")));
  const igual=pack.actas.length-nuevas.length;
  if(!nuevas.length){toast(pack.actas.length===1?"Nada nuevo: el acta del archivo ya estaba en la app.":`Nada nuevo: las ${pack.actas.length} actas del archivo ya estaban en la app.`);return}

  toast("Importando…");let nf=0,ff=0,vin=0;
  const ids=new Set(nuevas.map(x=>x.id));
  for(const x of nuevas){
    const a=JSON.parse(JSON.stringify(x));prepActa(a);
    for(const [k,r] of Object.entries(a.items||{})){
      const out=[];for(const f of (r.fotos||[])){
        if(f.startsWith("a:")&&!pack.fotos[f]){out.push(f);continue}
        const d=pack.fotos&&pack.fotos[f];if(!d){ff++;continue}
        const nr=await guardarFotoImportada(a,k,d);if(nr){out.push(nr);nf++}else ff++}

    }

    ACTAS[a.id]=a;
  }

  for(const id of ids){const a=ACTAS[id];if(a.tipo!=="devolucion")continue;

  }
  for(const id of ids)await saveActa(ACTAS[id]);
  schedSync(800);render();
  toast(`Listo: ${nuevas.length} ${nuevas.length===1?"acta importada":"actas importadas"}, ${nf} ${nf===1?"foto":"fotos"}${ff?`, ${ff} ${ff===1?"foto faltaba":"fotos faltaban"} en el archivo`:""}${vin?`, ${vin} ${vin===1?"devolución vinculada":"devoluciones vinculadas"} a su entrega`:""}.`);
}

function subDeLinea(l){if(l.sub!=null)return nfam(l.sub);const t=STOCK?STOCK.hora:"";if(SUBMAP_T!==t){SUBMAP={};filas().forEach(o=>{if(o.PRODUCTOCODIGO&&!SUBMAP[o.PRODUCTOCODIGO])SUBMAP[o.PRODUCTOCODIGO]=nfam(o.SUBFAMILIA)});SUBMAP_T=t}return SUBMAP[l.cod]||""}

/* Líneas del conteo: copia del stock del sistema al momento de iniciar + productos agregados a mano */
function nuevoConteo(dep,op){
  op=op||{};const fams=op.familias&&op.familias.length?new Set(op.familias):null;
  const base=filas().filter(o=>o.DEPOSITO===dep&&(!fams||fams.has(o.FAMILIA||"")));
  const lineas={};
  if(op.porPartida){base.forEach((o,i)=>{let k="p"+(o.PRODUCTOID||o.PRODUCTOCODIGO||i)+(o.PARTIDA?"-"+o.PARTIDA:"");k=k.replace(/[^\w-]/g,"_");if(lineas[k])k+="_"+i;lineas[k]={k,cod:o.PRODUCTOCODIGO,prod:o.PRODUCTO,fam:o.FAMILIA||"",sub:nfam(o.SUBFAMILIA),un:o.UNIDAD1||"",un2:o.UNIDAD2||"",sis:o.cant,sis2:num(o.CANTIDAD2),pu:num(o.PRECIOUNIDADSTOCK1)||(o.cant?o.imp/o.cant:0),partida:o.PARTIDA||"",vto:o.PARTIDA_VTO||"",orden:i}})}
  else{/* una línea por producto: las partidas se suman y quedan como detalle */
    base.forEach((o,i)=>{let k=("p"+(o.PRODUCTOID||o.PRODUCTOCODIGO||i)).replace(/[^\w-]/g,"_");const l=lineas[k]||(lineas[k]={k,cod:o.PRODUCTOCODIGO,prod:o.PRODUCTO,fam:o.FAMILIA||"",sub:nfam(o.SUBFAMILIA),un:o.UNIDAD1||"",un2:o.UNIDAD2||"",sis:0,sis2:0,imp:0,partidas:[],orden:i});
      l.sis+=o.cant;l.sis2+=num(o.CANTIDAD2);l.imp+=o.imp;if(o.PARTIDA)l.partidas.push({p:o.PARTIDA,c:o.cant,v:o.PARTIDA_VTO||""})});
    Object.values(lineas).forEach(l=>{l.pu=l.sis?l.imp/l.sis:0;delete l.imp;if(l.partidas&&!l.partidas.length)delete l.partidas})}
  const prev=conteosDe(dep).filter(c=>!c.anulado);const n=(prev.length?Math.max(...prev.map(c=>c.n||0)):0)+1;
  return{id:uid(),_col:"conteos",bodega:dep,n,fecha:today(),responsable:ME?ME.nombre:"",acompanante:"",estado:"abierto",ciego:!!op.ciego,porPartida:!!op.porPartida,tol:op.tol==null?2:+op.tol,familias:fams?[...fams]:null,stockAl:STOCK?STOCK.hora:"",lineas,items:{},creadoPor:yo(),creado:new Date().toISOString(),actualizado:new Date().toISOString()};
}
/* tolerancia: una diferencia menor al % definido se informa pero no cuenta como discrepancia */
function enTol(c,l,d){if(d===null||Math.abs(d)<1e-9)return true;const t=c.tol==null?2:+c.tol;if(!t)return false;const base=l.sis||0;return base>0&&Math.abs(d)/base*100<=t}
const lineasDe=c=>Object.values(c.lineas||{}).sort((a,b)=>String(a.manual?"zzz":a.fam||"").localeCompare(String(b.manual?"zzz":b.fam||""))||String(a.prod).localeCompare(String(b.prod)));
const obsDe=(c,k)=>{const r=(c.items||{})[k];return r&&r.obs!==undefined&&r.obs!==""?num(r.obs):null};
function difDe(c,l){const o=obsDe(c,l.k);if(o===null)return null;return o-(l.sis||0)}
function resumenConteo(c){
  const L=lineasDe(c);let cont=0,ok=0,tol=0,dif=0,falt=0,sobr=0,vf=0,vs=0;
  L.forEach(l=>{const d=difDe(c,l);if(d===null)return;cont++;if(Math.abs(d)<1e-9)ok++;else if(enTol(c,l,d)){tol++}else{dif++;const v=d*(l.pu||0);if(d<0){falt++;vf+=v}else{sobr++;vs+=v}}});
  return{total:L.length,cont,ok,tol,dif,falt,sobr,vf,vs,neto:vf+vs,exact:cont?Math.round((ok+tol)/cont*100):null};
}
/* productos con diferencia en al menos 2 de los últimos 3 conteos cerrados: señal de un problema de proceso, no de un error puntual */
function recurrentes(dep){
  const cs=conteosDe(dep).filter(c=>c.estado==="cerrado"&&!c.anulado).slice(0,3);if(cs.length<2)return[];
  const m={};cs.forEach(c=>lineasDe(c).forEach(l=>{const d=difDe(c,l);if(d===null||enTol(c,l,d))return;const key=l.cod||l.prod;(m[key]=m[key]||{cod:l.cod,prod:l.prod,n:0,ult:null}).n++;if(!m[key].ult)m[key].ult={c:c.n,d,un:l.un}}));
  return Object.values(m).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n);
}

/* dígito verificador que corresponde a los números del RUT (módulo 11) */
function rutDV(r){const c=String(r||"").replace(/[^0-9kK]/g,"").toUpperCase();if(c.length<2)return"";const num=c.slice(0,-1);let s=0,m=2;for(let i=num.length-1;i>=0;i--){s+=+num[i]*m;m=m===7?2:m+1}const r11=11-(s%11);return r11===11?"0":r11===10?"K":String(r11)}
const rutConDV=r=>{const c=String(r||"").replace(/[^0-9kK]/g,"").toUpperCase();return c.length<2?r:rutLimpio(c.slice(0,-1)+rutDV(c))};
function rutValido(r){const c=String(r||"").replace(/[^0-9kK]/g,"").toUpperCase();if(c.length<8)return false;const num=c.slice(0,-1),dv=c.slice(-1);let s=0,m=2;for(let i=num.length-1;i>=0;i--){s+=+num[i]*m;m=m===7?2:m+1}const r11=11-(s%11),dc=r11===11?"0":r11===10?"K":String(r11);return dc===dv}
const rutLimpio=r=>{const c=String(r||"").replace(/[^0-9kK]/g,"").toUpperCase();if(c.length<2)return c;const num=c.slice(0,-1),dv=c.slice(-1);return num.replace(/\B(?=(\d{3})+(?!\d))/g,".")+"-"+dv};
const normRut=r=>String(r||"").toUpperCase().replace(/[^0-9K]/g,"").replace(/^0+/,"");

/* Si un RUT tiene dos fichas en Finnegans (con y sin guion, con cero inicial o con espacios), se usa la de formato más limpio; las dos existen en Finnegans */
const puntajeCod=c=>(c===c.trim()?8:0)+(/-/.test(c)?4:0)+(/^\s*0/.test(c)?0:2)+(/\./.test(c)?0:1);
function orgsAgregar(map,codigo,nombre){const c=String(codigo==null?"":codigo);const n=normRut(c);if(!n||!/\d{6,}/.test(n))return;const prev=map[n];if(!prev||puntajeCod(c)>puntajeCod(prev[0]))map[n]=[c,String(nombre||"").trim()]}

const rutFin=r=>{const c=String(r||"").replace(/[^0-9kK]/g,"").toUpperCase().replace(/^0+/,"");return c.length<2?c:c.slice(0,-1)+"-"+c.slice(-1)};
/* busca en Finnegans una organización por el nombre del emisor (para sugerir el RUT correcto) */
const normNom=t=>normTxt(t).replace(/[.,]/g," ").replace(/\b(S A|SA|SPA|LTDA|LIMITADA|EIRL|Y CIA|CIA)\b/g," ").replace(/\s+/g," ").trim();

/* Jefatura que aprueba: la columna puede traer un nombre (se busca su correo en Aprobadores o en Colaboradores) o directamente un correo */
function jefaturaDe(c){
  if(!c||!c.jefe)return null;const j=String(c.jefe).trim();
  if(/@/.test(j)){const co=j.toLowerCase();const a=aprobadores().find(x=>x.correo===co)||colabs().find(x=>correosDe(x).includes(co));return{nombre:a?a.nombre:co,correo:co}}

function rdDestinos(r,ev){

/* ---------- Eventos ---------- */
async function axClick(A,b){
  if(A==="axHub"){await flush();cur=null;go("axhub");return true}
  if(A==="axList"){await flush();cur=null;axTipo=b.dataset.t||axTipo;axQ="";go("axl");return true}
  if(A==="axBack"){await flush();const t=cur?cur.tipo:axTipo;cur=null;axTipo=t;go("axl");return true}
  if(A==="axNew"){cur=nuevaAx(axTipo);axStep=0;await saveActa(cur);go("axe");return true}
  if(A==="axOpen"){await flush();const x=ACTAS[b.dataset.id];if(!x)return true;cur=prepAx(x);axTipo=x.tipo;axStep=0;go("axe");return true}
  if(A==="axStep"){const s=+b.dataset.s;if(s<0||s>2)return true;axStep=s;window.scrollTo(0,0);render();return true}
  if(A==="axDev"){await flush();const e=ACTAS[b.dataset.id];if(!e||e.estado!=="cerrada"||esDev(e))return true;
    if(e.devolucionId&&ACTAS[e.devolucionId]){cur=prepAx(ACTAS[e.devolucionId]);axTipo=cur.tipo;axStep=0;go("axe");return true}
    const d=nuevaAxDev(e);await saveActa(d);e.devolucionId=d.id;e.actualizado=new Date().toISOString();await saveActa(e);cur=d;axTipo=d.tipo;axStep=0;go("axe");return true}
  if(A==="axDevA"){if(ro())return true;const x=(cur.activos||[]).find(y=>y.id===b.dataset.r);if(!x)return true;x.devuelto=x.devuelto===b.dataset.v?"":b.dataset.v;if(x.devuelto!=="si"){x.estadoDev=""}touch();const keep=window.scrollY;render();window.scrollTo(0,keep);return true}
  if(A==="axYN"){if(ro())return true;const g=b.dataset.g,k=b.dataset.k,v=b.dataset.v;cur[g]=cur[g]||{};cur[g][k]=cur[g][k]===v?undefined:v;if(!cur[g][k])delete cur[g][k];touch();const keep=window.scrollY;render();window.scrollTo(0,keep);return true}
  if(A==="axAddAct"){if(ro())return true;cur.activos.push({id:uid().slice(-6),estado:""});touch();render();const l=cur.activos[cur.activos.length-1];const el=$("#x_"+l.id+"_tipo");if(el){el.scrollIntoView({block:"center"});el.focus()}return true}
  if(A==="axDelAct"){if(ro())return true;const r=b.dataset.r,x=cur.activos.find(y=>y.id===r);if(!x)return true;
    if((x.tipo||x.marca||x.ref)&&!(await ask("¿Quitar este activo?",[x.tipo,x.marca,x.ref].filter(Boolean).join(" · "),"Quitar",true)))return true;
    cur.activos=cur.activos.filter(y=>y.id!==r);const it=cur.items["a_"+r];if(it){(it.fotos||[]).forEach(f=>borrarFotoRef(f));delete cur.items["a_"+r]}touch();const keep=window.scrollY;render();window.scrollTo(0,keep);return true}
  if(A==="axDel"){const a=b.dataset.id?ACTAS[b.dataset.id]:cur;if(!a||a.estado==="cerrada")return true;
    if(!(await ask("¿Eliminar este borrador?",`${axTitulo(a)} · ${axQuien(a)}. Se borran el acta y sus fotos. No se puede deshacer.`,"Eliminar",true)))return true;
    await removeActa(a.id);Object.values(a.items||{}).forEach(r=>(r.fotos||[]).forEach(f=>borrarFotoRef(f)));
    if(esDev(a)&&a.entregaId&&ACTAS[a.entregaId]&&ACTAS[a.entregaId].devolucionId===a.id){const e=ACTAS[a.entregaId];delete e.devolucionId;e.actualizado=new Date().toISOString();await saveActa(e)}
    if(cur&&cur.id===a.id)cur=null;axTipo=a.tipo;go("axl");toast("Borrador eliminado.");return true}
  if(A==="axDelFoto"){if(!cur||ro())return true;const k=b.dataset.k,ref=b.dataset.ref;if(!(await ask("¿Eliminar esta foto?","","Eliminar",true)))return true;
    const r=cur.items[k]||{};r.fotos=(r.fotos||[]).filter(x=>x!==ref);delete LOST[ref];borrarFotoRef(ref);touch();const keep=window.scrollY;render();window.scrollTo(0,keep);toast("Foto eliminada.");return true}
  if(A==="axPdf"){const a=b.dataset.id?ACTAS[b.dataset.id]:cur;if(a)await axDescargar(a);return true}
  if(A==="axXlsx"){await axXlsx(axTipo,true);return true}
  if(A==="axClose"){if(!cur||ro())return true;const m=axFaltantes(cur);
    if(m.length){const g=await ask("Faltan datos para cerrar el acta","Completa lo siguiente. Mientras tanto queda guardada como borrador.","Ir a completar",false,`<ul class="miss" style="margin:0 0 12px">${m.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`);
      if(g){const datos=/^(Fecha|Lugar|Predio|Nombre|RUT|Cargo|Quién entrega \(Admin|Tipo Vehículo|Marca|Modelo|Año|Patente|Combustible|Km)/;axStep=m.some(x=>datos.test(x)&&!/firma/i.test(x))?0:m.some(x=>/accesorio|llaves|Descripción|activo/i.test(x))?1:2;window.scrollTo(0,0);render()}return true}

    delete a.anulada;a.actualizado=new Date().toISOString();await saveActa(a);render();toast("Acta restaurada.");if(DB&&navigator.onLine!==false)axXlsx(a.tipo,false);return true}
  return false;

function axInput(ev){
  const t=ev.target;
  if(t.id==="axq"){axQ=t.value;const L=$("#axlists");if(L){const tmp=document.createElement("div");tmp.innerHTML=renderAxList();L.innerHTML=tmp.querySelector("#axlists").innerHTML}return}
  if(view!=="axe"||!cur||ro())return;
  if(t.dataset.x){axSet(cur,t.dataset.x,t.value);
    if(t.dataset.x==="conductor"||t.dataset.x==="recibe"){const role=t.dataset.x==="conductor"?"conductor":"recibe";const f=cur.firmas[role]||{};if(!f.nombre||f.nombre===cur._lastN){cur.firmas[role]=Object.assign(f,{nombre:t.value})}cur._lastN=t.value}
    if(t.dataset.x==="rut"||t.dataset.x==="rutRecibe"){const e=$("#axRutErr");if(e)e.textContent=""}
    axTouch();return}
  if(t.dataset.xa){const x=cur.activos.find(y=>y.id===t.dataset.xa);if(x){x[t.dataset.k]=t.value;axTouch()}return}
  if(t.dataset.xsn){cur.firmas[t.dataset.xsn]=Object.assign(cur.firmas[t.dataset.xsn]||{},{nombre:t.value});axTouch();return}
  if(t.dataset.xsc){cur.firmas[t.dataset.xsc]=Object.assign(cur.firmas[t.dataset.xsc]||{},{cargo:t.value});axTouch();return}
}
function axChange(ev){
  const t=ev.target;if(view!=="axe"||!cur||ro())return;
  if(t.dataset.xfoto){const files=[...t.files];t.value="";const k=t.dataset.xfoto;addFotos(cur,k,files).then(()=>{if(view==="axe"){const keep=window.scrollY;render();window.scrollTo(0,keep)}});return}
  if(t.dataset.xs){cur[t.dataset.xs]=t.value;touch();const keep=window.scrollY;render();window.scrollTo(0,keep);return}
  if(t.dataset.xa){const x=cur.activos.find(y=>y.id===t.dataset.xa);if(x){x[t.dataset.k]=t.value;axTouch()}return}
  if(t.dataset.xadm){const role=t.dataset.xadm,v=t.value,f=cur.firmas[role]||{};const prev=f.sel||f.nombre||"";
    if(f.img&&prev&&prev!==v){delete f.img;delete f.fechaFirma;toast("Cambió la persona de Administración: la firma anterior se borró.")}
    f.sel=v;if(v==="otro"){if(personasAdm().some(p=>p.nombre===f.nombre))f.nombre=""}else{f.nombre=v;if(!f.cargo)f.cargo="Administración"}
    cur.firmas[role]=f;touch();const keep=window.scrollY;render();window.scrollTo(0,keep);
    if(v==="otro"){const i=document.querySelector(`[data-xsn="${role}"]`);if(i)i.focus({preventScroll:true})}return}
  if(t.dataset.x==="rut"||t.dataset.x==="rutRecibe"){const k=t.dataset.x;cur[k]=rutFmt(t.value);t.value=cur[k];const e=$("#axRutErr");if(e)e.textContent=cur[k]&&!rutOk(cur[k])?"El RUT no es válido. Revisa el dígito verificador.":"";touch()}
  if(t.dataset.x&&t.dataset.x.startsWith("veh.patente")){cur.veh.patente=String(t.value).toUpperCase().replace(/[^A-Z0-9]/g,"");t.value=cur.veh.patente;touch()}
  axUpdClose();
}
function axVerFoto(ref,k){
  const src=fotoSrc(ref);if(!src){toast(LOST[ref]?"Esta foto no se pudo recuperar.":"La foto todavía se está descargando.");return}

  m.innerHTML=`<div class="sheet viewer" role="dialog" aria-modal="true" aria-label="Foto"><h3>Foto</h3><img src="${esc(src)}" alt="Foto del acta"><div class="btns">${!ro()?`<button class="btn danger" data-m="del">Eliminar foto</button>`:""}<button class="btn pri" data-m="close" style="flex:1">Cerrar</button></div></div>`;
  document.body.appendChild(m);document.body.style.overflow="hidden";const close=()=>{m.remove();document.body.style.overflow=""};

function axHeaderAct(d,tit){

  d.rect(L,y,W,h);d.line(60,y,60,y+h);d.line(165,y,165,y+h);d.line(165,y+h/2,195,y+h/2);
  {const lh=h-4,lw=Math.min(42,lh*LOGO_R);try{d.addImage(LOGO,"JPEG",37.5-lw/2,y+2,lw,lh,"logo")}catch(e){}}
  d.setFont("helvetica","bold");d.setFontSize(10);d.text("Departamento de Administración y Finanzas",112.5,y+8.5,{align:"center"});d.text(tit||"Registro de entrega de activos",112.5,y+14.5,{align:"center"});

async function recoverFotos(){
  if(!IDB.db)return;
  let ks=[];try{ks=await TO(IDB.keys("fotos"),6000)}catch(e){return}
  for(const k of ks){
    let v=null;try{v=await TO(IDB.get("fotos",k),5000)}catch(e){}
    let b=null;if(v)b=await recBlob(v);
    if(!b){LOST[k]=true}
    else{
      if(v.blob&&!v.data){try{await TO(IDB.put("fotos",k,{data:await b.arrayBuffer(),type:b.type,actaId:v.actaId,k:v.k,col:v.col}),5000)}catch(e){}}
      QF[k]={actaId:v.actaId,k:v.k,col:v.col};if((v.type||b.type)==="application/pdf")QF[k].pdf=1;try{FOTO[k]=URL.createObjectURL(b)}catch(e){}
    }
    if(v&&v.k)refrescarFotoItem({actaId:v.actaId,k:v.k,col:v.col});
  }
  if(cur&&view==="edit"&&step===1)refreshLost();
  status();schedSync(800);
}

/* ---------- Actualización automática ---------- */
let SWREG=null,UPD_READY=false,UPD_CHECKING=false;
function aplicarUpdate(){flush().then(()=>{try{sessionStorage.setItem("actas-actualizado","1")}catch(e){}location.reload()})}
function avisoUpdate(){
  UPD_READY=true;
  /* Si no hay un acta abierta, se actualiza sola; si la hay, se avisa y se actualiza al salir */
  if(view!=="edit"){aplicarUpdate();return}
  if(!$(".updbar")){const b=document.createElement("div");b.className="updbar";b.innerHTML=`<span>Hay una versión nueva de la app.</span><button class="btn pri" data-upd="1">Actualizar ahora</button>`;document.body.appendChild(b);
    b.querySelector("[data-upd]").addEventListener("click",aplicarUpdate)}
}
async function buscarUpdate(manual){
  if(!SWREG){if(manual)toast("Esta función solo está disponible en la app instalada.");return}
  if(UPD_CHECKING)return;UPD_CHECKING=true;
  try{await SWREG.update();
    if(manual&&!UPD_READY){await new Promise(r=>setTimeout(r,2500));if(!UPD_READY)toast(`Ya tienes la última versión (${APP_VER}).`)}
  }catch(e){if(manual)toast("No se pudo revisar: sin conexión con el servidor.")}
  finally{UPD_CHECKING=false}
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    SWREG=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)avisoUpdate();
    const habiaSW0=!!navigator.serviceWorker.controller;
    reg.addEventListener("updatefound",()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener("statechange",()=>{if(nw.state==="activated"&&habiaSW0)avisoUpdate()})});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")buscarUpdate(false)});
    window.addEventListener("online",()=>buscarUpdate(false));
    setInterval(()=>buscarUpdate(false),10*60*1000);
  }).catch(()=>{});
  const habiaSW=!!navigator.serviceWorker.controller;let recargado=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!habiaSW||recargado||UPD_READY)return;recargado=true;avisoUpdate()});
  try{if(sessionStorage.getItem("actas-actualizado")){sessionStorage.removeItem("actas-actualizado");setTimeout(()=>toast(`App actualizada a la versión ${APP_VER}.`),600)}}catch(e){}
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
init();
setTimeout(()=>{try{pushRefrescar()}catch(e){}},1500);
