# Servidor de Puduhue Terreno (Cloudflare Worker). Se publica solo desde GitHub Actions al cambiar esta carpeta.
# keep_vars: las variables de texto y las claves configuradas en Cloudflare no se tocan al publicar.
name = "puduhue-terreno"
main = "worker.js"
compatibility_date = "2025-09-01"
account_id = "dda1f0d0dc944e948f7cc45ad3df5f1f"
workers_dev = true
keep_vars = true

[observability]
enabled = true

# v215.1 (19-11-2026, con el OK de Benja): las reglas de quién puede cambiar qué (Rendiciones, Actas, Check list, Stock y
# Control de bodega) BLOQUEAN lo que no cumple (403, no se guarda); antes solo avisaban. Para volver a «aviso», cambiar aquí.
[vars]
OD_MODO = "bloquear"

# Notificaciones en el teléfono (v83): almacenamiento propio del servidor para los equipos registrados
[[durable_objects.bindings]]
name = "AVISOS"
class_name = "Avisos"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Avisos"]

# Recordatorios (v84): cada hora; el código decide si es la hora (9:00 de Santiago, días hábiles)
[triggers]
crons = ["5 * * * *"]
