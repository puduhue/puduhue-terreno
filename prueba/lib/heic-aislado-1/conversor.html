<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; img-src blob: data:; connect-src blob: data:">
<title>Conversor de fotos HEIC</title></head><body>
<script>
/* Puduhue Terreno (desde la v219): convierte fotos HEIC a JPEG con heic2any (lib/heic2any-0.0.4), AISLADO de la app.
   La app abre este archivo en un marco aparte (sandbox="allow-scripts allow-same-origin": del mismo origen para que el service
   worker lo entregue sin señal; Chromium no atiende un marco con origen propio). heic2any necesita 'unsafe-eval' (su conversor crea
   código al vuelo); esa licencia vale solo para este archivo, y la app principal ya no la tiene: ningún texto que llegue a la app
   puede convertirse en código. La app le pasa el código de heic2any (de su caché, así funciona sin señal) y cada foto;
   el marco devuelve el JPEG. No cambiar este archivo: una versión nueva va en una carpeta nueva (lib/heic-aislado-2/…). */
var listo = false;
addEventListener("message", function (e) {
  if (e.source !== parent) return;
  var m = e.data || {};
  var responder = function (x, tr) { parent.postMessage(Object.assign({ id: m.id }, x), "*", tr || []); };
  try {
    if (m.tipo === "lib") {
      if (!listo) { (0, eval)(String(m.codigo || "")); listo = typeof self.heic2any === "function"; }
      responder({ ok: listo }); return;
    }
    if (m.tipo === "convertir") {
      if (!listo) { responder({ ok: false, error: "sin conversor" }); return; }
      self.heic2any({ blob: new Blob([m.buf], { type: "image/heic" }), toType: "image/jpeg", quality: m.q || 0.92 })
        .then(function (r) { var b = Array.isArray(r) ? r[0] : r; return b.arrayBuffer(); })
        .then(function (buf) { responder({ ok: true, buf: buf }, [buf]); })
        .catch(function (x) { responder({ ok: false, error: String((x && (x.message || x.code)) || x) }); });
    }
  } catch (x) { responder({ ok: false, error: String((x && x.message) || x) }); }
});
parent.postMessage({ tipo: "listo" }, "*");
</script>
</body></html>
