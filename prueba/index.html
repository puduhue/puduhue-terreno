  const tiene=m=>{try{return TB_DATOS[m.k]?!!TB_DATOS[m.k]():false}catch(e){return false}};
  const sc=m=>(u[m.k]||0)*2+(tiene(m)?1:0)+(m.k==="rd"?0.5:0);
  /* Rendiciones entra siempre que haya espacio: casi todos rinden */
  let el=disp.filter(m=>sc(m)>=1||m.k==="rd").sort((a,b)=>(sc(b)-sc(a))||(TB_MODS.indexOf(a)-TB_MODS.indexOf(b))).slice(0,3);

/* ---------- v121: permisos por persona y módulo ----------

   Niveles: "agregar" (ve y agrega, el valor de siempre), "ver" (solo ve: no crea, no edita ni elimina borradores) y "no" (no ve
   el módulo). Stock solo tiene "agregar" (= ve) y "no". Rendiciones es para todos. Quien no está en la lista ve y agrega en todo
   y el administrador siempre ve y edita en todo.
   Se guarda en OneDrive: Apps de terreno / _config / Permisos_app.json (los correos no van en el código, que es público), con una
   copia en el teléfono para que valga sin señal. */

    try{return await gjson(`/drives/${M365.drive}/items/${d}:/${encName(PERM_FILE)}?$select=id,eTag`)}catch(e){if(e.code==="not_found")return null;throw e}};
  let usaba=false;try{usaba=!!localStorage.getItem(PERM_DIR_K)}catch(e){}

  if(!meta&&usaba){try{localStorage.removeItem(PERM_DIR_K)}catch(e){}meta=await leer()}
  if(!meta){if(!Object.keys(PERM.personas).length)return false;PERM=permVacio();PERM_ETAG="";permLocal();return true}

   no confundirse con desplazar una lista. No aplica a la firma (se dibuja con el dedo), a los visores de fotos y PDF, al
   buscador (pantalla completa) ni al computador. Todas las hojas que se pueden arrastrar muestran la manilla arriba. */

   - Se bloquea el zoom de la página (pellizco, doble toque y el acercamiento al tocar un campo). iPhone no respeta
     «user-scalable=no» en Safari, por eso además se cancelan sus gestos de zoom.
   - En los visores de fotos (boletas, facturas, check list, conteos y actas) se puede ampliar con dos dedos o tocando
     dos veces, y mover la foto ampliada para leer el detalle. En el computador: doble clic y luego rueda o arrastrar.
   - En el computador no cambia nada de esto (zoom del navegador y selección de texto siguen igual). */
const TACTIL=(()=>{try{return matchMedia("(hover: none) and (pointer: coarse)").matches||(navigator.maxTouchPoints>0&&!matchMedia("(hover: hover)").matches)}catch(e){return false}})();
(()=>{
  if(!TACTIL)return;
  try{const m=document.querySelector('meta[name="viewport"]');if(m)m.setAttribute("content","width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover")}catch(e){}
  document.documentElement.classList.add("sin-zoom");
  ["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
  document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1&&!(e.target&&e.target.closest&&e.target.closest(".zoomw")))e.preventDefault()},{passive:false});
})();
/* zoom dentro de una foto */
function hacerZoom(img){
  if(!img||img.closest(".zoomw"))return;
  const w=document.createElement("div");w.className="zoomw";img.parentNode.insertBefore(w,img);w.appendChild(img);
  img.draggable=false;img.style.transformOrigin="0 0";
  const h=document.createElement("div");h.className="zoomh";h.textContent=TACTIL?"Pellizca o toca dos veces para ampliar":"Doble clic para ampliar";w.appendChild(h);
  let s=1,x=0,y=0,ini=null,tap=null,ultimo=0;const P=new Map();
  const lim=()=>{const W=w.clientWidth,H=w.clientHeight;s=Math.min(5,Math.max(1,s));x=Math.min(0,Math.max(W-W*s,x));y=Math.min(0,Math.max(H-H*s,y));if(s===1){x=0;y=0}};
  const pintar=()=>{lim();img.style.transform=s===1?"":`translate(${x}px,${y}px) scale(${s})`;w.classList.toggle("ampliada",s>1.01);w.style.touchAction=s>1.01?"none":"pan-y"};
  const rel=(cx,cy)=>{const r=w.getBoundingClientRect();return{px:cx-r.left,py:cy-r.top}};
  const zoomEn=(ns,px,py)=>{ns=Math.min(5,Math.max(1,ns));x=px-(px-x)*(ns/s);y=py-(py-y)*(ns/s);s=ns;pintar()};
  w.addEventListener("pointerdown",e=>{
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});try{w.setPointerCapture(e.pointerId)}catch(_){}
    if(P.size===2){const[a,b]=[...P.values()],m=rel((a.x+b.x)/2,(a.y+b.y)/2);ini={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s,x,y,mx:m.px,my:m.py};tap=null}
    else if(P.size===1){ini={cx:e.clientX,cy:e.clientY,x,y};tap={t:Date.now(),cx:e.clientX,cy:e.clientY}}
  });
  w.addEventListener("pointermove",e=>{
    if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===2&&ini&&ini.d){const[a,b]=[...P.values()],m=rel((a.x+b.x)/2,(a.y+b.y)/2),ns=Math.min(5,Math.max(1,ini.s*Math.hypot(a.x-b.x,a.y-b.y)/ini.d));
      x=m.px-(ini.mx-ini.x)*(ns/ini.s);y=m.py-(ini.my-ini.y)*(ns/ini.s);s=ns;pintar();e.preventDefault()}
    else if(P.size===1&&ini&&ini.cx!==undefined){if(tap&&Math.hypot(e.clientX-tap.cx,e.clientY-tap.cy)>8)tap=null;
      if(s>1.01){x=ini.x+(e.clientX-ini.cx);y=ini.y+(e.clientY-ini.cy);pintar();e.preventDefault()}}
  });
  const fin=e=>{
    const t=tap;P.delete(e.pointerId);
    if(P.size===1){const[a]=[...P.values()];ini={cx:a.x,cy:a.y,x,y}}else if(!P.size)ini=null;
    if(e.type==="pointerup"&&t&&Date.now()-t.t<350&&TACTIL){const now=Date.now();
      if(now-ultimo<320){const r=rel(e.clientX,e.clientY);if(s>1.01){s=1;pintar()}else zoomEn(2.5,r.px,r.py);ultimo=0}else ultimo=now}
    tap=null;
  };
  w.addEventListener("pointerup",fin);w.addEventListener("pointercancel",fin);
  w.addEventListener("dblclick",e=>{if(TACTIL)return;e.preventDefault();const r=rel(e.clientX,e.clientY);if(s>1.01){s=1;pintar()}else zoomEn(2.5,r.px,r.py)});
  w.addEventListener("wheel",e=>{if(s<=1.01&&!e.ctrlKey)return;e.preventDefault();const r=rel(e.clientX,e.clientY);zoomEn(s*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0025)),r.px,r.py)},{passive:false});
  w.addEventListener("click",e=>{if(s>1.01)e.stopPropagation()},true);
  img.addEventListener("load",pintar);pintar();
}

   - si quedaron cambios sin subir, pregunta: subirlos con la cuenta nueva (quedan con el nombre de quien los hizo) o borrarlos
     (con una segunda confirmación);

     lo vuelve a bajar con la nueva;

   Los correos pendientes de otra cuenta no salen desde esta: esperan a su dueño (enviarCorreosPend). */
const CUENTA_K="actas-cuenta";

  const yoC={id:ME.id,correo:String(ME.correo||"").toLowerCase(),nombre:ME.nombre||ME.correo||""};
  const guardar=()=>{try{localStorage.setItem(CUENTA_K,JSON.stringify(yoC))}catch(e){}};
  if(!ant||ant.id===yoC.id||ant.correo&&ant.correo===yoC.correo){guardar();return false}
  const quien=ant.nombre||ant.correo||"otra cuenta";
  const loc=await localAll(),nReg=Object.keys(loc).length;let nFot=0;try{nFot=(await IDB.keys("fotos")).length}catch(e){}
  try{nFot+=Object.keys(localStorage).filter(k=>k.startsWith("actas-foto-")).length}catch(e){}
  if(nReg+nFot+DELQ.size){
    const det=[nReg?`${nReg} ${nReg===1?"registro":"registros"}`:"",nFot?`${nFot} ${nFot===1?"foto o archivo":"fotos o archivos"}`:"",DELQ.size?`${DELQ.size} ${DELQ.size===1?"borrador eliminado":"borradores eliminados"}`:""].filter(Boolean).join(", ");

    if(!subir&&await ask("¿Borrar los cambios sin subir?",`Se borran de este teléfono los cambios de ${quien} que no alcanzaron a subir. No se pueden recuperar.`,"Borrarlos",true,"","No, subirlos"))await pendBorrarTodo(loc);
  }
